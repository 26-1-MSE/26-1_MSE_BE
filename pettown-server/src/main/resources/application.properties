spring.application.name=pettown-server

# Active datasource profile: h2 or mysql
spring.profiles.active=h2

# Server
server.port=8080

# Forwarded headers (ngrok, reverse proxy 지원)
server.forward-headers-strategy=framework

# JWT
jwt.secret=pettown-secret-key-must-be-at-least-32-characters-long-enough-for-hmac-sha384-algorithm
jwt.expiration=86400000

# admin
admin.username=admin
admin.password=admin1234!

# OpenAI
openai.api.key=🔥🔥🔥
