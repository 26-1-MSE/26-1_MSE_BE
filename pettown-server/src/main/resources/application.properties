spring.application.name=pettown-server

# Server
server.port=8080

# H2 (local file-based database)
spring.datasource.url=jdbc:h2:file:./data/pettown;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Forwarded headers (ngrok, reverse proxy 지원)
server.forward-headers-strategy=framework

# JWT
jwt.secret=pettown-secret-key-must-be-at-least-32-characters-long-enough-for-hmac-sha384-algorithm
jwt.expiration=86400000

# admin
admin.username=admin
admin.password=admin1234!

# OpenAI
openai.api.key=🔥🔥🔥
