spring.application.name=pettown-server

# Server
server.port=8080

# H2 (file mode — data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/pettown
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Forwarded headers (ngrok, reverse proxy 지원)
server.forward-headers-strategy=framework

# JWT
jwt.secret=pettown-secret-key-must-be-at-least-32-characters-long-enough-for-hmac-sha384-algorithm
jwt.expiration=86400000

# admin
admin.username=admin
admin.password=admin1234!

